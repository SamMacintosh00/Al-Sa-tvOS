name: Build Al-Sa tvOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned tvOS app
        run: |
          xcodebuild             -project Al-Sa.xcodeproj             -scheme Al-Sa             -configuration Release             -sdk appletvos             -destination 'generic/platform=tvOS'             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build             CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Al-Sa.app Payload/Al-Sa.app
          /usr/bin/zip -qry Al-Sa.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Al-Sa-unsigned-ipa
          path: Al-Sa.ipa

      - name: Upload app bundle for debugging
        uses: actions/upload-artifact@v4
        with:
          name: Al-Sa-app-bundle
          path: build/Al-Sa.app
